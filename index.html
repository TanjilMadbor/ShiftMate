<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tanjil Madbor">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <title>ShiftMate | Shift Entry</title>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="brand">
            <img src="images/logo.svg" alt="" class="brand-logo">
            <h1>Shift<span class="brand-accent">Mate</span></h1>
        </a>
        <p class="tagline">Your one-stop solution for efficient shift management and seamless timesheet tracking.</p>
    </header>

    <nav id="nav_bar">
        <ul>
            <li><a href="" class=active >Home</a></li>
            <li id="nav_registration"><a href="registeration.html">Registration</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="shift_record.html">Shift Record</a></li>
        </ul>
    </nav>
    
    <div class="container">

        <h2>Shift Entry Portal</h2>
        <p id="user_status"></p>
        <form id="form" novalidate>
        <div>
            <label for="date">Day: </label> <br>
            <input type="date" id="date" placeholder="Enter the Day" required>
        </div>
        <div>
            <label for="start_time">Start Time: </label> <br>
            <input type="time" id="start_time" placeholder="Enter Start Time" required> 
        </div>

        <div>
            <label for="end_time">End Time: </label><br>
            <input type="time" id="end_time" placeholder="Enter Start Time" required>
        </div>
        <div>
            <label for="week_type">Week Type:</label> <br>
            <select id="week_type" name="week_type">
                <option value="" hidden> Select Week Type</option>
                <option value="week01">Week 01</option>
                <option value="week02">Week 02</option>
            </select>
        </div>
        <button type="button" id="btn">Submit</button>

        <p id="message"></p>
        </form>

    </div>
    <script src="js/shift_entry.js" type="module"></script>


    
</body>
</html>
