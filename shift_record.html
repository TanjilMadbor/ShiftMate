<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Shift Record</title>
</head>
<body>
    <header>
        <h1>Welcome to Shift Mate!</h1>
        <p>Your one-stop solution for efficient shift management and seamless timesheet tracking.</p>
    </header>

    <nav id="nav_bar">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li id="nav_registration"><a href="registeration.html">Registration</a></li>
        <li><a href="login.html" >Login</a></li>
        <li><a href="shift_record.html" class=active>Shift Record</a></li>
    </ul>
    </nav>
    <div class="container">
        <h2>Past Shift Records</h2>
        <p id="user_status"></p>

        <div class="table-wrapper">
            <table class="shift-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Week Type</th>
                </tr>
                </thead>
                <tbody id="shift_table_body"></tbody>
            </table>
        </div>

        <div class="pagination">
            <button type="button" id="prev_btn" class="page-btn" hidden>&larr; Previous</button>
            <span id="page_label"></span>
            <button type="button" id="next_btn" class="page-btn" hidden>Next &rarr;</button>
        </div>
        <p id="message"></p>
    </div>
<script src="js/shift_record.js" type="module"></script>

</body>
  
</html>
